[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-reusable-auth"
version = "0.1.0"
authors = [
  { name="Joel Sam Donkor", email="donkorjoel203@gmail.com" },
]
description = "django-reusable-auth is an open-source authentication package designed to help Django developers implement authentication without repeatedly rebuilding the same authentication logic for every project."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "Django>=5.2",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/joeldonkor/django-reusable-auth"
Issues = "https://github.com/joeldonkor/django-reusable-auth/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reusable_auth*"]

[tool.setuptools.package-data]
reusable_auth = ["templates/reusable_auth/email/*"]

[project.optional-dependencies]
test = ["pytest", "pytest-django", "flake8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]