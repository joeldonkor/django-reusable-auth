[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-reusable-auth"
version = "1.0.1"
authors = [
  { name="Joel Sam Donkor", email="donkorjoel203@gmail.com" },
]
description = "JWT authentication API for Django REST Framework, with sessions, email verification and brute-force protection."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["django", "rest-framework", "authentication", "jwt", "simplejwt", "rate-limiting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
]
dependencies = [
    "Django>=5.2",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
# OpenAPI schema and Swagger UI for the endpoints
openapi = ["drf-spectacular>=0.28"]
test = ["pytest", "pytest-django", "pytest-cov", "flake8", "drf-spectacular>=0.28"]

[project.urls]
Homepage = "https://github.com/joeldonkor/django-reusable-auth"
Documentation = "https://github.com/joeldonkor/django-reusable-auth#readme"
Changelog = "https://github.com/joeldonkor/django-reusable-auth/blob/main/CHANGELOG.md"
Issues = "https://github.com/joeldonkor/django-reusable-auth/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reusable_auth*"]

[tool.setuptools.package-data]
reusable_auth = ["templates/reusable_auth/email/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["reusable_auth"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
